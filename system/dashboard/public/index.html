<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2a516">
<title>لوحة وميض الضياء</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <img src="icon.svg" alt="" width="56" height="56">
    <h1>لوحة وميض الضياء</h1>
    <p class="muted">منظومة الوكلاء على جهازك</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر" required>
    <button class="btn primary" type="submit">دخول</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>وميض الضياء</span></div>
    <div id="pauseBox" class="pause-box"></div>
  </header>

  <nav class="tabs" id="tabs">
    <a href="#home" data-tab="home">الرئيسية</a>
    <a href="#approvals" data-tab="approvals">الموافقات <b id="pendingBadge" class="badge hidden">0</b></a>
    <a href="#agents" data-tab="agents">الوكلاء</a>
    <a href="#log" data-tab="log">السجل</a>
    <a href="#settings" data-tab="settings">الإعدادات</a>
  </nav>

  <main id="view" class="view"></main>
  <div id="toast" class="toast hidden"></div>
</div>

<dialog id="dlg"><div id="dlgBody"></div><form method="dialog"><button class="btn">إغلاق</button></form></dialog>
<script src="app.js"></script>
</body>
</html>
