# ============================================================
# لوحة تحكم وميض الضياء فوق docker-compose.yml الموجود في C:\wameed
# (postgres + n8n + waha). تضيف خدمة واحدة فقط: wameed-dashboard،
# ومتغيرًا واحدًا لـ n8n (WAMEED_DASH_TOKEN) يحمي webhook «SYS - Dashboard Approve».
#
# التفعيل: scripts/install.ps1 يضيف إلى C:\wameed\.env السطر:
#   COMPOSE_FILE=docker-compose.yml;wameed-aldiya/system/docker-compose.wameed.yml
# (المسارات النسبية هنا تُحسب من C:\wameed، مجلد الملف الأول)
# ============================================================
services:
  n8n:
    environment:
      WAMEED_DASH_TOKEN: ${WAMEED_DASH_TOKEN:?ضع WAMEED_DASH_TOKEN في .env}

  wameed-dashboard:
    build: ${WAMEED_SYSTEM_DIR:-./wameed-aldiya/system}/dashboard
    image: wameed-dashboard:local
    restart: unless-stopped
    depends_on: [postgres, n8n]
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?ضع DASHBOARD_PASSWORD في .env}
      WAMEED_DASH_TOKEN: ${WAMEED_DASH_TOKEN}
      N8N_API_KEY: ${N8N_API_KEY:-}     # لتفعيل وإيقاف الوكلاء من اللوحة فقط
      CEO_MODEL: ${CEO_MODEL:-qwen3:8b}   # عقل الرئيس التنفيذي المحلي
      PGHOST: postgres
      PGUSER: wameed
      PGPASSWORD: ${PG_PASSWORD}
      BIZ_PGDATABASE: wameed_ads      # biz_* وads_* (نفس Credential «Postgres wameed_ads»)
      N8N_PGDATABASE: n8n             # حالة الـ workflows (قراءة فقط)
      N8N_INTERNAL_URL: http://n8n:5678
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      OLLAMA_URL: http://host.docker.internal:11434
      MANAGER_URL: http://100.95.125.96:55668
      TZ: Asia/Riyadh
    ports:
      - "127.0.0.1:8080:8080"     # من الجوال: عبر tailscale serve فقط (انظر الدليل)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama يعمل على ويندوز مباشرة
